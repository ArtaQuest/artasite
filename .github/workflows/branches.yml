# Verification for every branch that is not `main`.
#
# The checks are `tools/preflight.sh`, which is the SAME script a developer runs before pushing —
# so "green on your branch" and "green here" are the same statement, and a gate that is wrong is
# wrong in one place instead of two. They used to be written out here in YAML, which meant the only
# way to run them was to push and wait, and every one had to be re-implemented by anyone checking
# locally. Two of them silently degraded to no-ops that way: a lint step whose file filter matched
# nothing, and a typecheck run without its project flag.
#
# This file NEVER deploys. `main.yml` does that, and WordPress.com binds to it.

name: branches

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: branches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # preflight diffs against this push's predecessor for the changed-file gates; a depth-1
          # clone does not contain it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: artaquest-web/package-lock.json

      # ONE place computes what "this push" means, and preflight reads it. It was derived twice
      # before — two chances to disagree.
      - name: Resolve what this push added
        id: range
        run: |
          before='${{ github.event.before }}'
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "base=${before}" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify 'HEAD~1' >/dev/null; then
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            # HEAD is a ROOT commit: HEAD~1 does not exist, and asking git for it is a FATAL error,
            # not an empty range — it took every gate down with exit 128 on a new repo's first push.
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight
        env:
          AQ_PHP_BIN: php
        run: bash tools/preflight.sh ${{ steps.range.outputs.base }}
