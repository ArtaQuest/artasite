<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img">
  
  <defs>
    <clipPath id="ah"><circle cx="31" cy="40" r="17"/></clipPath>
    <clipPath id="as"><circle cx="49" cy="40" r="17"/></clipPath>
  </defs>
  <!-- the integrated core: where heritage (gold) and the wider society (blue) overlap -->
  <g clip-path="url(#ah)">
    <rect x="40" y="22" width="18" height="36" fill="#2352E8" clip-path="url(#as)"/>
    <rect x="22" y="22" width="18" height="36" fill="var(--ico-gold,#E8B923)" clip-path="url(#as)"/>
  </g>
  <!-- two dimensions: heritage maintenance (gold) x participation in the wider society (blue) -->
  <circle cx="31" cy="40" r="17" fill="none" stroke="var(--ico-gold,#E8B923)" stroke-width="2.6"/>
  <circle cx="49" cy="40" r="17" fill="none" stroke="#2352E8" stroke-width="2.6"/>
</svg>
