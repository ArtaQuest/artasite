<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img">
  
  <defs>
    <clipPath id="ih"><circle cx="31" cy="40" r="17"/></clipPath>
    <clipPath id="is"><circle cx="49" cy="40" r="17"/></clipPath>
  </defs>
  <!-- heritage kept, fully -->
  <circle cx="31" cy="40" r="17" fill="var(--ico-gold,#E8B923)"/>
  <!-- and the wider society joined, fully -->
  <circle cx="49" cy="40" r="17" fill="#2352E8"/>
  <!-- both held together at the overlap -->
  <g clip-path="url(#ih)"><rect x="22" y="22" width="18" height="36" fill="var(--ico-gold,#E8B923)" clip-path="url(#is)"/></g>
</svg>
