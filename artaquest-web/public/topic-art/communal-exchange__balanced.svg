<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Balanced — care and fairness held together">
  <circle cx="26" cy="42" r="6" fill="var(--ico-gold,#E8B923)"/>
  <circle cx="54" cy="42" r="6" fill="#2352E8"/>
  <!-- gift given freely (gold) -->
  <path d="M31,37 Q40,26 49,37" fill="none" stroke="var(--ico-gold,#E8B923)" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="49" cy="37" r="2.4" fill="var(--ico-gold,#E8B923)"/>
  <!-- returned in kind (blue) -->
  <path d="M49,47 Q40,58 31,47" fill="none" stroke="#2352E8" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="31" cy="47" r="2.4" fill="#2352E8"/>
  <g stroke="#2352E8" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.7">
    <line x1="36" y1="40.8" x2="44" y2="40.8"/>
    <line x1="36" y1="43.6" x2="44" y2="43.6"/>
  </g>
</svg>
