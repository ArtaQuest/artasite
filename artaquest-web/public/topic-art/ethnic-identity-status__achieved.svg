<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img">
  
  <!-- explored in every direction... -->
  <g stroke="#2352E8" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="40" x2="40" y2="12"/>
    <line x1="40" y1="40" x2="60" y2="20"/>
    <line x1="40" y1="40" x2="68" y2="40"/>
    <line x1="40" y1="40" x2="60" y2="60"/>
    <line x1="40" y1="40" x2="40" y2="68"/>
    <line x1="40" y1="40" x2="20" y2="60"/>
    <line x1="40" y1="40" x2="12" y2="40"/>
    <line x1="40" y1="40" x2="20" y2="20"/>
  </g>
  <!-- ...the breadth bound into one whole -->
  <circle cx="40" cy="40" r="28" fill="none" stroke="#2352E8" stroke-width="2" opacity="0.7"/>
  <!-- a secure, committed core -->
  <circle cx="40" cy="40" r="12" fill="var(--ico-gold,#E8B923)"/>
  <circle cx="40" cy="40" r="5" fill="#2352E8"/>
</svg>
