<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img">
  <!-- UK ONS 2021 census ethnic group: five high-level groups, each branching into named subgroups (a two-tier self-identification) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the single ethnic-group question -->
    <rect x="34" y="8" width="12" height="12" rx="2.6" stroke="var(--ico-gold,#E8B923)" stroke-width="2.4"/>
    <!-- trunk and bus distributing to the five high-level groups -->
    <path d="M40 20 V28 M16 28 H64 M16 28 V39 M28 28 V39 M40 28 V39 M52 28 V39 M64 28 V39" stroke="#2352E8" stroke-width="2.2"/>
  </g>
  <!-- five high-level group nodes; the central one is selected -->
  <circle cx="16" cy="43" r="4" fill="none" stroke="#2352E8" stroke-width="2.2"/>
  <circle cx="28" cy="43" r="4" fill="none" stroke="#2352E8" stroke-width="2.2"/>
  <circle cx="40" cy="43" r="4.6" fill="var(--ico-gold,#E8B923)"/>
  <circle cx="52" cy="43" r="4" fill="none" stroke="#2352E8" stroke-width="2.2"/>
  <circle cx="64" cy="43" r="4" fill="none" stroke="#2352E8" stroke-width="2.2"/>
  <!-- the selected group branches into its named subgroups -->
  <path d="M40 48 V55 M33 55 H47 M33 55 V60 M47 55 V60" fill="none" stroke="var(--ico-gold,#E8B923)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="33" cy="63" r="3" fill="var(--ico-gold,#E8B923)"/>
  <circle cx="47" cy="63" r="3" fill="none" stroke="var(--ico-gold,#E8B923)" stroke-width="2"/>
</svg>
