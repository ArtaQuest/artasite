<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Forgiveness — a gold heart lifting free from open blue hands">
  <circle cx="40" cy="40" r="40" fill="#06121E"/>
  <!-- open, cupped hands letting go -->
  <path d="M16 52 Q40 72 64 52" fill="none" stroke="#2352E8" stroke-width="4" stroke-linecap="round"/>
  <path d="M21 50 Q23 58 30 61 M59 50 Q57 58 50 61" fill="none" stroke="#2352E8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- the heart, released and rising -->
  <path d="M40 48 C 32 42, 25 37.5, 25 31.5 C 25 27.5, 28 24.7, 31.6 24.7 C 35 24.7, 38 27.2, 40 30 C 42 27.2, 45 24.7, 48.4 24.7 C 52 24.7, 55 27.5, 55 31.5 C 55 37.5, 48 42, 40 48 Z" fill="var(--ico-gold,#E8B923)"/>
  <!-- rising sparks -->
  <circle cx="40" cy="17" r="2" fill="var(--ico-gold,#E8B923)"/>
  <circle cx="29" cy="20" r="1.4" fill="var(--ico-gold,#E8B923)" opacity="0.85"/>
  <circle cx="51" cy="20" r="1.4" fill="var(--ico-gold,#E8B923)" opacity="0.85"/>
</svg>
