  <!-- the watching, judging eye of an ever-present God -->
  <path d="M22 40 Q40 25 58 40 Q40 55 22 40 Z" fill="var(--ico-ink,#0C1E32)" stroke="var(--ico-gold,#E8B923)" stroke-width="2.4"/>
