<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Distant — a cosmic force that set things in motion and stepped back">
  
  <circle cx="40" cy="40" r="39" fill="none" stroke="var(--ico-gold,#E8B923)" stroke-width="1.4"/>
  <!-- orbits set in motion, then left to run on their own -->
  <g fill="none" stroke="#2352E8" stroke-width="2">
    <ellipse cx="40" cy="40" rx="29" ry="12" transform="rotate(30 40 40)"/>
    <ellipse cx="40" cy="40" rx="29" ry="12" transform="rotate(-30 40 40)"/>
  </g>
  <!-- the cosmic source: distant, neither engaged nor judging -->
  <circle cx="40" cy="40" r="6.5" fill="var(--ico-gold,#E8B923)"/>
  <!-- worlds far out on their courses -->
  <circle cx="64.5" cy="33.5" r="3" fill="var(--ico-gold,#E8B923)"/>
  <circle cx="18" cy="48" r="2.4" fill="#2352E8"/>
</svg>
