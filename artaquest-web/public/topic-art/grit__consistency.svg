<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Consistency of interest — a compass needle holding a steady northward bearing within a blue ring">
  
  
  <circle cx="40" cy="40" r="25" fill="none" stroke="#2352E8" stroke-width="1.8" stroke-opacity="0.5"/>
  <g stroke="#2352E8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="40" y1="16" x2="40" y2="21"/>
    <line x1="40" y1="59" x2="40" y2="64"/>
    <line x1="16" y1="40" x2="21" y2="40"/>
    <line x1="59" y1="40" x2="64" y2="40"/>
  </g>
  <polygon points="40,20 45,40 35,40" fill="var(--ico-gold,#E8B923)"/>
  <polygon points="40,60 45,40 35,40" fill="var(--ico-gold,#E8B923)" fill-opacity="0.4"/>
  <circle cx="40" cy="40" r="3.4" fill="var(--ico-gold,#E8B923)"/>
