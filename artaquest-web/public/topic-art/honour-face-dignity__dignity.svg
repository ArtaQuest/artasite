    <line x1="57" y1="40" x2="66" y2="40"/>
    <line x1="52" y1="52" x2="58.4" y2="58.4"/>
    <line x1="40" y1="57" x2="40" y2="66"/>
    <line x1="28" y1="52" x2="21.6" y2="58.4"/>
    <line x1="23" y1="40" x2="14" y2="40"/>
    <line x1="28" y1="28" x2="21.6" y2="21.6"/>
    <line x1="40" y1="23" x2="40" y2="14"/>
    <line x1="52" y1="28" x2="58.4" y2="21.6"/>
