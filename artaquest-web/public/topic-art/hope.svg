<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Hope — a blue path climbing toward a radiant gold star">
  <circle cx="40" cy="40" r="40" fill="#06121E"/>
  <!-- the hoped-for goal: a radiant gold star -->
  <path d="M40 13 L42.5 20.3 L50.2 20.4 L44 25 L46.3 32.3 L40 27.8 L33.7 32.3 L36 25 L29.8 20.4 L37.5 20.3 Z" fill="var(--ico-gold,#E8B923)"/>
  <g stroke="var(--ico-gold,#E8B923)" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="40" y1="6" x2="40" y2="10"/>
    <line x1="23" y1="22.5" x2="26.5" y2="23.5"/>
    <line x1="57" y1="22.5" x2="53.5" y2="23.5"/>
  </g>
  <!-- the way: a blue path rising toward the goal -->
  <path d="M21 67 Q33 60 35 50 Q37 42 40 36" fill="none" stroke="#2352E8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="21" cy="67" r="2.8" fill="#2352E8"/>
</svg>
