<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Balanced — self and group held in equal weight">
  
  <!-- one bond bridging self and group -->
  <line x1="33" y1="40" x2="47" y2="42" stroke="#2352E8" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- the group: three bonded others -->
  <polygon points="54,30 62,44 46,44" fill="none" stroke="#2352E8" stroke-width="1.4" stroke-opacity="0.7"/>
  <g fill="#2352E8">
    <circle cx="54" cy="30" r="4"/>
    <circle cx="62" cy="44" r="4"/>
    <circle cx="46" cy="44" r="4"/>
  </g>
  <!-- the self: equal in weight to the whole group -->
  <circle cx="24" cy="40" r="9" fill="var(--ico-gold,#E8B923)"/>
</svg>
