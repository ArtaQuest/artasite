<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Collectivist-leaning — a self woven into the group">
  
  <!-- the self is woven into a group of four -->
  <g stroke="#2352E8" stroke-width="1.5" stroke-opacity="0.75" fill="none">
    <line x1="40" y1="40" x2="24" y2="28"/>
    <line x1="40" y1="40" x2="58" y2="24"/>
    <line x1="40" y1="40" x2="60" y2="48"/>
    <line x1="40" y1="40" x2="30" y2="58"/>
    <line x1="24" y1="28" x2="58" y2="24"/>
    <line x1="60" y1="48" x2="30" y2="58"/>
  </g>
  <g fill="#2352E8">
    <circle cx="24" cy="28" r="4"/>
    <circle cx="58" cy="24" r="4"/>
    <circle cx="60" cy="48" r="4"/>
    <circle cx="30" cy="58" r="4"/>
  </g>
  <!-- the self: still its own, but central to the group -->
  <circle cx="40" cy="40" r="7.5" fill="var(--ico-gold,#E8B923)"/>
</svg>
