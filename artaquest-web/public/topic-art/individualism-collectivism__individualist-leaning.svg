<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Individualist-leaning — a strong self with a few loose ties">
  
  <!-- loose ties to a couple of others -->
  <g stroke="#2352E8" stroke-width="1.5" stroke-opacity="0.5">
    <line x1="35" y1="42" x2="58" y2="26"/>
    <line x1="35" y1="42" x2="57" y2="56"/>
  </g>
  <!-- two others, kept at a distance -->
  <circle cx="59" cy="25" r="4" fill="#2352E8"/>
  <circle cx="58" cy="57" r="4" fill="#2352E8"/>
  <!-- the dominant self -->
  <circle cx="33" cy="42" r="11.5" fill="none" stroke="var(--ico-gold,#E8B923)" stroke-width="1.4" stroke-opacity="0.55"/>
  <circle cx="33" cy="42" r="9" fill="var(--ico-gold,#E8B923)"/>
</svg>
