<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Strongly collectivist — a tightly bonded group">
  
  <!-- a tight mesh: everyone bonded to everyone -->
  <g stroke="#2352E8" stroke-width="1.4" stroke-opacity="0.7" fill="none" stroke-linejoin="round">
    <polygon points="40,22 56,31 56,49 40,58 24,49 24,31"/>
    <line x1="40" y1="22" x2="40" y2="58"/>
    <line x1="24" y1="31" x2="56" y2="49"/>
    <line x1="56" y1="31" x2="24" y2="49"/>
  </g>
  <g fill="#2352E8">
    <circle cx="56" cy="31" r="3.8"/>
    <circle cx="56" cy="49" r="3.8"/>
    <circle cx="40" cy="58" r="3.8"/>
    <circle cx="24" cy="49" r="3.8"/>
    <circle cx="24" cy="31" r="3.8"/>
  </g>
  <!-- the self, equal among them, bound into the whole -->
  <circle cx="40" cy="22" r="3.8" fill="var(--ico-gold,#E8B923)"/>
</svg>
