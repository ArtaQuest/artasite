  <line x1="21" y1="27" x2="59" y2="27" stroke="#E8B923" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="40" y1="27" x2="40" y2="57" stroke="#2352E8" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="30" y1="57" x2="50" y2="57" stroke="#2352E8" stroke-width="3" stroke-linecap="round"/>
  <line x1="21" y1="27" x2="21" y2="40" stroke="#E8B923" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <circle cx="21" cy="44" r="5" fill="#E8B923"/>
  <line x1="59" y1="27" x2="59" y2="34" stroke="#2352E8" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <circle cx="59" cy="38" r="4.6" fill="none" stroke="#2352E8" stroke-width="2.6"/>
