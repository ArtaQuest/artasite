<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Maximiser or satisficer">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#0C1E32"/>
      <stop offset="1" stop-color="#010C17"/>
