<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Decision difficulty">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#0C1E32"/>
      <stop offset="1" stop-color="#010C17"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="40" fill="url(#bg)"/>
  <!-- decision difficulty: one path forks into many, and the choice is hard to make -->
  <line x1="40" y1="62" x2="40" y2="44" stroke="#E8B923" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M40 44 L24 26" fill="none" stroke="#2352E8" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M40 44 L40 24" fill="none" stroke="#2352E8" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M40 44 L56 26" fill="none" stroke="#2352E8" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="24" cy="26" r="3.2" fill="#2352E8"/>
  <circle cx="40" cy="24" r="3.2" fill="#2352E8"/>
  <circle cx="56" cy="26" r="3.2" fill="#2352E8"/>
  <circle cx="40" cy="44" r="3.6" fill="#E8B923"/>
</svg>
