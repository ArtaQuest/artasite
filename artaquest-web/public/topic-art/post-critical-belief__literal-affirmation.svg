<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Literal belief — reads the tradition literally and affirms its transcendent truth">
  
  <circle cx="40" cy="40" r="39" fill="none" stroke="var(--ico-gold,#E8B923)" stroke-width="1.4"/>
  <!-- transcendent pole, lit -->
  <path d="M40 4 L41.2 9 L46 10.2 L41.2 11.4 L40 16.4 L38.8 11.4 L34 10.2 L38.8 9 Z" fill="var(--ico-gold,#E8B923)"/>
  <!-- immanent pole, dim -->
  <line x1="32" y1="72" x2="48" y2="72" stroke="#2352E8" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.3"/>
  <!-- this stance = top-left: literal (solid disc) + transcendent -->
  <rect x="18.5" y="19.5" width="19" height="19" rx="4.5" fill="var(--ico-gold,#E8B923)"/>
  <circle cx="28" cy="29" r="4.8" fill="var(--ico-ink,#06121E)"/>
  <g fill="none" stroke="#2352E8" stroke-width="1.3" stroke-opacity="0.45">
    <rect x="42.5" y="19.5" width="19" height="19" rx="4.5"/>
    <rect x="18.5" y="41.5" width="19" height="19" rx="4.5"/>
    <rect x="42.5" y="41.5" width="19" height="19" rx="4.5"/>
  </g>
</svg>
