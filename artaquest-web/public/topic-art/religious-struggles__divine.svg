<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="With the divine — anger at or distance from God">
  
  <circle cx="40" cy="40" r="39" fill="none" stroke="var(--ico-gold,#E8B923)" stroke-width="1.4"/>
  <!-- the divine, above -->
  <path d="M22 28 Q40 13 58 28" fill="none" stroke="var(--ico-gold,#E8B923)" stroke-width="2.6" stroke-linecap="round"/>
  <g stroke="var(--ico-gold,#E8B923)" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="9" x2="40" y2="15"/>
    <line x1="25" y1="13" x2="28" y2="18"/>
    <line x1="55" y1="13" x2="52" y2="18"/>
  </g>
  <!-- the self, below -->
  <circle cx="40" cy="60" r="6" fill="#2352E8"/>
  <!-- the bond, broken -->
  <g stroke="var(--ico-gold,#E8B923)" stroke-width="2.4" stroke-linecap="round">
    <line x1="40" y1="33" x2="40" y2="40"/>
    <line x1="40" y1="48" x2="40" y2="51"/>
  </g>
</svg>
