<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Resilience — a gold ball springing back up out of a blue dip">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#0C1E32"/>
      <stop offset="1" stop-color="#010C17"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="40" fill="url(#bg)"/>
  <!-- resilience as bouncing back: a blue dip of adversity, a gold ball springing back up along a dashed rebound arc -->
  <path d="M16 46 Q40 70 64 46" fill="none" stroke="#2352E8" stroke-width="3" stroke-linecap="round"/>
  <path d="M34 57 Q29 38 40 27" fill="none" stroke="#E8B923" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.5 5.5"/>
  <polygon points="40,19 36.3,27 43.7,27" fill="#E8B923"/>
  <circle cx="34" cy="57" r="4.6" fill="#E8B923"/>
</svg>
