<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Big Bounce">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#0C1E32"/>
      <stop offset="1" stop-color="#010C17"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="40" fill="url(#bg)"/>
  <!-- an endless cycle: collapse seeds a new expansion -->
  <path d="M40 19 A21 21 0 1 1 25 25" fill="none" stroke="#2352E8" stroke-width="3" stroke-linecap="round"/>
  <path d="M25 25 l-5 -4 l8 -1 z" fill="#2352E8"/>
  <circle cx="40" cy="40" r="11" fill="none" stroke="#E8B923" stroke-width="1" opacity="0.4"/>
  <!-- the bounce flash where one cosmos rekindles the next -->
  <circle cx="40" cy="40" r="5" fill="#E8B923"/>
  <g stroke="#E8B923" stroke-width="1.3" stroke-linecap="round">
    <line x1="40" y1="31" x2="40" y2="27"/>
    <line x1="40" y1="49" x2="40" y2="53"/>
    <line x1="31" y1="40" x2="27" y2="40"/>
    <line x1="49" y1="40" x2="53" y2="40"/>
  </g>
</svg>
