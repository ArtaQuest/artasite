<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Big Crunch">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#0C1E32"/>
      <stop offset="1" stop-color="#010C17"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="40" fill="url(#bg)"/>
  <!-- contracting rings collapsing toward a dense core -->
  <circle cx="40" cy="40" r="22" fill="none" stroke="#E8B923" stroke-width="1.2" opacity="0.32"/>
  <circle cx="40" cy="40" r="15" fill="none" stroke="#E8B923" stroke-width="1.6" opacity="0.6"/>
  <!-- arrows driving inward from every side -->
  <g fill="#2352E8">
    <path d="M40 24 l5 -8 h-10 z"/>
    <path d="M40 56 l5 8 h-10 z"/>
    <path d="M24 40 l-8 -5 v10 z"/>
    <path d="M56 40 l8 -5 v10 z"/>
  </g>
  <!-- hot dense core -->
  <circle cx="40" cy="40" r="6" fill="#E8B923"/>
</svg>
