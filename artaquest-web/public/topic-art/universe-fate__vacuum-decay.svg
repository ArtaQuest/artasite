<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Vacuum decay">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#0C1E32"/>
      <stop offset="1" stop-color="#010C17"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="40" fill="url(#bg)"/>
  <!-- the old vacuum: a field of points -->
  <g fill="#E8B923" opacity="0.7">
    <circle cx="20" cy="20" r="1.4"/><circle cx="34" cy="15" r="1.4"/><circle cx="50" cy="17" r="1.4"/><circle cx="63" cy="23" r="1.4"/>
    <circle cx="15" cy="36" r="1.4"/><circle cx="65" cy="40" r="1.4"/>
    <circle cx="18" cy="53" r="1.4"/><circle cx="61" cy="56" r="1.4"/>
    <circle cx="30" cy="63" r="1.4"/><circle cx="47" cy="65" r="1.4"/>
  </g>
  <!-- a bubble of true vacuum nucleates and expands at light speed -->
  <circle cx="40" cy="42" r="15" fill="#010C17"/>
  <circle cx="40" cy="42" r="15" fill="none" stroke="#2352E8" stroke-width="3"/>
  <circle cx="40" cy="42" r="20" fill="none" stroke="#2352E8" stroke-width="1.2" opacity="0.4"/>
  <g stroke="#2352E8" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <line x1="40" y1="27" x2="40" y2="22"/><line x1="55" y1="42" x2="60" y2="42"/>
    <line x1="40" y1="57" x2="40" y2="62"/><line x1="25" y1="42" x2="20" y2="42"/>
  </g>
</svg>
