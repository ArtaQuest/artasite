<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Arta, thinking">
  <title>Arta, thinking</title>
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1f2a5c"/>
      <stop offset="0.55" stop-color="#141833"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b923"/>
      <stop offset="1" stop-color="#4a72ff"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <g clip-path="url(#disc)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the thought: blue, because anything Arta makes or wields is blue -->
    <circle cx="255" cy="114" r="6.5" fill="#4a72ff"/>
    <path transform="translate(263 60) scale(0.86)" d="M5 30 a14 14 0 0 1 10 -22 a17 17 0 0 1 30 -6 a15 15 0 0 1 24 12 a13 13 0 0 1 -4 24 a15 15 0 0 1 -24 8 a17 17 0 0 1 -28 -2 a12 12 0 0 1 -8 -14 z" fill="#0f1430" stroke="#4a72ff" stroke-width="9"/>
    <!-- the spark inside it: gold, the why -->
    <path transform="translate(294 77) scale(0.95)" d="M0 -15 L3.6 -3.6 L15 0 L3.6 3.6 L0 15 L-3.6 3.6 L-15 0 L-3.6 -3.6 Z" fill="#e8b923"/>
    <!-- Arta, upper body and close up: the companion's own figure, gold, faceless (on purpose); fingertip to the chin -->
    <g stroke="#e8b923" stroke-width="22">
      <path d="M183 256 L202 430"/>
      <path d="M189 300 L278 354 L262 440"/>
      <path d="M189 300 L100 352 L137 248"/>
      <circle cx="176" cy="168" r="74"/>
    </g>
  </g>
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#rim)" stroke-opacity="0.55" stroke-width="8"/>
</svg>
